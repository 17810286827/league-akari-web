# 前端生产 nginx 配置：静态托管 + /api 反代 + /cdn 图片代理缓存 + history 路由兜底

# 游戏资源图片代理缓存层（图片加载慢根治）：
# 国内浏览器直连 Riot 海外 CDN（Cloudflare 美国 / CloudFront 洛杉矶）每张 0.6~2.6s，
# 且 ddragon 响应无 Cache-Control（跨会话零缓存）。改为经本服务器（阿里云）代理：
# 回源只慢一次，之后所有用户命中本地磁盘缓存（命中后 <50ms）。
proxy_cache_path /var/cache/nginx/cdn
  levels=1:2
  keys_zone=cdn_cache:10m
  max_size=500m
  inactive=30d
  use_temp_path=off;

# CDN 上游分组：raw.communitydragon.org（英雄头像/技能图标/游戏数据）
upstream cdn_cdragon {
  server raw.communitydragon.org:443;
  keepalive 8;
}

# CDN 上游分组：ddragon.leagueoflegends.com（装备图标/召唤师头像）
upstream cdn_ddragon {
  server ddragon.leagueoflegends.com:443;
  keepalive 8;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Vite 产物文件名带 contenthash，内容变化即换名，可安全长缓存
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # API 反代到宿主机上后端容器映射的 8081 端口（免 CORS）
  location /api/ {
    # 注意：proxy_pass 不带尾部斜杠——后端 controller 自带 /api 前缀
    # （@RequestMapping("/api/matches")），必须原样转发；带斜杠会剥掉前缀导致 404
    proxy_pass http://host.docker.internal:8081;
    # SSE 流式依赖 HTTP/1.1 与上游保持长连接（nginx 默认 1.0 靠 connection-close 分帧，依赖后端实现细节）
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # SSE 流式必需：禁用缓冲，否则 AI 对局分析前端收不到实时数据
    proxy_buffering off;
    proxy_cache off;
    # AI 分析可能持续数分钟，读超时须大于后端最长处理时间（默认 60s 会掐断流）
    proxy_read_timeout 300s;
  }

  # ---- 游戏资源图片代理：/cdn/cdragon/** 与 /cdn/ddragon/** ----
  # 前端 URL 生成统一改走同源路径（见 utils/icon-url.ts、game-resource.ts），
  # 命中缓存时直接从磁盘返回，未命中时回源海外并落缓存供后续复用。
  # proxy_ssl_server_name 必须开启（SNI），否则 443 握手会被 Cloudflare/CloudFront 拒绝
  location /cdn/cdragon/ {
    proxy_pass https://cdn_cdragon/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host raw.communitydragon.org;
    proxy_ssl_server_name on;
    # 回源失败容错：超时/5xx 时用过期缓存兜底（海外 CDN 偶发抖动不影响已缓存图片）
    proxy_cache cdn_cache;
    proxy_cache_key $uri;
    # 7 天内不再回源校验（英雄/装备图标内容极少变化，"latest" 更新频率以月计）
    proxy_cache_valid 200 7d;
    proxy_cache_valid 404 10m;
    proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
    # 并发回源合并：同一张图并发请求只放一个回源（防止缓存击穿）
    proxy_cache_lock on;
    proxy_cache_lock_timeout 30s;
    # 浏览器侧同样缓存 7 天（命中本地后零网络请求）
    add_header Cache-Control "public, max-age=604800";
    add_header X-Cache-Status $upstream_cache_status;
  }

  location /cdn/ddragon/ {
    proxy_pass https://cdn_ddragon/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host ddragon.leagueoflegends.com;
    proxy_ssl_server_name on;
    proxy_cache cdn_cache;
    proxy_cache_key $uri;
    # ddragon 版本号在 URL 内（/cdn/{version}/img/...），版本切换即换 key，可放心长缓存
    proxy_cache_valid 200 7d;
    proxy_cache_valid 404 10m;
    proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 30s;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Cache-Status $upstream_cache_status;
  }

  # history 路由兜底：刷新/直达子路径时返回 index.html，交给 vue-router 解析
  location / {
    try_files $uri $uri/ /index.html;
  }
}
